name: fastbuild offload-oc-mt76
on: workflow_dispatch
permissions: write-all
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04-arm
    strategy: {fail-fast: false, matrix: {target: [offload-oc-mt76]}}
    env:
      DK_OPENWRT: /bld/openwrt
      DK_BIN: /bld/openwrt_bin
      DK_USER: /bld/user
      DK_PROFILE: /bld/user/current
      GH_TOKEN: ${{ github.token }}
      IMG_INC: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ matrix.target }}-inc
    steps:
    - uses: actions/checkout@v7

    - uses: docker/login-action@v4
      with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ github.token }}'}

    - id: gh
      uses: actions/cache/restore@v5
      with: {path: "ghcache\nstcache", key: 'cache-${{ matrix.target }}.${{ github.run_id }}', restore-keys: 'cache-${{ matrix.target }}.'}
    - id: dl
      uses: actions/cache/restore@v5
      with: {path: dlcache, key: 'dlcache.${{ github.run_id }}', restore-keys: dlcache.}

    - name: Seed caches if missing
      run: |
        mkdir -p openwrt_bin ghcache stcache dlcache
        if [ -z "$(ls -A ghcache 2>&-)" ] || [ -z "$(ls -A stcache 2>&-)" ]; then
          # Best-effort: a new profile has no image of its own, and this runs under `bash -e`.
          for I in ghcr.io/w1700k/fastbuild_base:base-bldcache-${{ matrix.target }} \
                   ghcr.io/w1700k/fastbuild_base:base-bldcache-SNAPSHOT; do
            if docker pull "$I" 2>&-; then
              echo "seeding build cache from $I"
              docker create --name CA "$I" >/dev/null
              for d in ghcache stcache dlcache; do docker cp CA:/$d/. $d; done
              docker rm CA >/dev/null
              break
            fi
          done
          echo "cache seeding finished"
        fi

    - name: Initialize environment
      run: |
        curl -Z --create-dirs -Lo user/default/files/etc/apk/repositories.d/distfeeds.list https://w1700k.github.io/builds/distfeeds.list
        curl -Z -Lo user/default/files/etc/vermagic.txt https://w1700k.github.io/builds/vermagic.txt
        [ -f "user/${{ matrix.target }}/config.diff" ] || { echo "::error::config.diff not found for ${{ matrix.target }}"; exit 1; }
        # Two passes: with one multi-source rsync the FIRST source wins a same-named file.
        rsync -aI --mkpath user/default/ user/current/ 2>&-
        rsync -aI --mkpath user/${{ matrix.target }}/ user/current/ 2>&-
        if [ -f "user/${{ matrix.target }}/custom.sh" ]; then
          [ "$(sha256sum < user/${{ matrix.target }}/custom.sh)" = "$(sha256sum < user/current/custom.sh)" ] \
            || { echo "::error::user/current/custom.sh is not the profile's"; exit 1; }
        fi
        echo 'CONFIG_CCACHE_DIR="/ghcache"' >> user/current/config.diff
        sudo tee /etc/docker/daemon.json <<< '{"max-concurrent-downloads":50,"max-concurrent-uploads":50,"experimental":true}'
        sudo systemctl reload docker
        IMAGE=$IMG_INC; docker pull $IMAGE 2>&- || IMAGE=ghcr.io/w1700k/fastbuild_base:base-builder
        docker run -dt --name DK -v $PWD/user:$DK_USER -v $PWD/openwrt_bin:$DK_BIN -v $PWD/ghcache:/ghcache -v $PWD/stcache:/stcache -v $PWD/dlcache:/dlcache $IMAGE
        install -m 755 /dev/stdin /usr/local/bin/docker_exec <<'DKR'
        #!/bin/bash
        for n in DK_BIN DK_USER DK_PROFILE DK_OPENWRT; do e+=(-e "$n=${!n}"); done
        exec docker exec -u 0 -i "${e[@]}" "$@"
        DKR

    - name: Prepare OpenWrt source
      run: |
        docker_exec DK bash -e -c '
          . $DK_USER/default/settings.ini &>/dev/null ||:
          . $DK_PROFILE/settings.ini
          [[ $REPO_URL && $REPO_BRANCH ]] || { echo "::error::Missing REPO_URL or REPO_BRANCH"; exit 1; }
          mkdir -p $DK_OPENWRT/files
          cd $DK_OPENWRT
          if [ ! -d .git ]; then git init; fi
          git remote set-url origin $REPO_URL 2>&- || git remote add origin $REPO_URL
          # The -inc image is committed after custom.sh edited the tree, so a warm
          # run starts dirty and `pull --rebase` refuses.
          git rev-parse --verify HEAD &>/dev/null && git reset --hard &>/dev/null ||:
          git fetch && git checkout $REPO_BRANCH && git pull --rebase
          { git log origin/main..$REPO_BRANCH --oneline || echo "(no commits ahead of main)"; } > files/build_info
          mountpoint $DK_BIN || { echo "::error::not mounted" >&2; exit 1; }
          cp files/build_info $DK_BIN
          ln -sf $DK_BIN bin && ln -sf /dlcache dl && ln -sf /stcache staging_dir
          bp=$DK_PROFILE fc=feeds.conf
          cp $bp/files/$fc $fc 2>&- && cp $fc /tmp/feeds.bak
          rm -rf feeds/* &>/dev/null; ./scripts/feeds update -a &>/dev/null; ./scripts/feeds install -a
          mv /tmp/feeds.bak $fc &>/dev/null ||:
          cp $bp/config.diff .config
          cat $bp/patches/*.patch 2>&- | patch -d . -p0 --forward ||:
          cp -r $bp/files/ . &>/dev/null ||:
          bash $bp/custom.sh &>/dev/null ||:
          make defconfig; echo "CONFIG_VERSION_NUMBER=${{ matrix.target }}" >> .config
          make download -j8 2>&1 | tee /dev/stderr | grep -q "ERROR:" || [ $PIPESTATUS -ne 0 ] && exit 1 ||:
        '

    - name: Compile OpenWrt
      run: |
        docker_exec -e MODE=c DK bash -c '
          bash $DK_PROFILE/pre_compile.sh 2>&- ||:
          cd $DK_OPENWRT
          export FORCE_UNSAFE_CONFIGURE=1 CCACHE_SLOPPINESS=file_stat_matches,include_file_mtime,time_macros CCACHE_NOHASHDIR=true CCACHE_COMPILERCHECK=content
          make -j$(($(nproc) + 1)) V=$MODE; rc=$?
          staging_dir/host/bin/ccache -d /ghcache -sz ||:
          exit $rc  # else the step exits with ccache status and a broken build looks green
        ' || {
          echo "::group::verbose retry (make -j1 V=sc)"
          docker_exec DK bash -c 'cd $DK_OPENWRT && make -j1 V=sc'  # unpiped: tail would buffer
          echo "::endgroup::"
          exit 1
        }

    - name: Create release
      run: |
        sudo chown -R "$(id -u):$(id -g)" openwrt_bin stcache
        find -L openwrt_bin/targets/*/* -maxdepth 1 -type f -exec install -D -t firmware {} +
        VERSION="${{ matrix.target }}_$(date +'%Y.%m.%d')_$(jq -r '.version_code' firmware/profiles.json)"
        sed -i "s/^/    /; 1s/^/## $VERSION\n\n/" openwrt_bin/build_info
        gh release list --json tagName --jq '.[].tagName' | grep "^${{ matrix.target }}_" | xargs -r gh release delete --cleanup-tag -y ||:
        gh release create $VERSION firmware/*sysupgrade.itb --title $VERSION --notes-file openwrt_bin/build_info

    - name: Upload builder container
      run: |
        docker_exec DK bash -c 'cd $DK_OPENWRT && rm -rf bin build_dir feeds tmp'
        docker commit -a openwrt-fastbuild -m "Building at $(date)" DK $IMG_INC
        docker push $IMG_INC

    # The build writes these as root inside the container. `Create release` held the only
    # chown, so a failed compile skipped it and the save died on `tar: ... Permission
    # denied` -- run 30780378830 lost cache-offload-oc-mt76 that way.
    - name: Reclaim cache ownership
      if: always()
      run: sudo chown -R "$(id -u):$(id -g)" ghcache stcache dlcache

    - uses: actions/cache/save@v5
      if: always()
      with: {path: "ghcache\nstcache", key: '${{ steps.gh.outputs.cache-primary-key }}'}
    - uses: actions/cache/save@v5
      if: always()
      with: {path: dlcache, key: '${{ steps.dl.outputs.cache-primary-key }}'}

    # After the saves, never before. Deleting first meant a failed save left no entry at
    # all; the current run's own key is excluded so it survives the sweep.
    - name: Delete old caches
      if: always()
      run: |
        for p in dlcache. cache-${{ matrix.target }}.; do
          keep="$p${{ github.run_id }}"
          gh cache list --json key,id --jq ".[] | select(.key | startswith(\"$p\")) | select(.key != \"$keep\") | .id" | xargs -r gh cache delete
        done ||:

    # actions/cache/save downgrades a tar failure to a warning, so the run looks green
    # while the cache is gone. Make that loud.
    - name: Verify caches saved
      if: always()
      run: |
        for k in cache-${{ matrix.target }}.${{ github.run_id }} dlcache.${{ github.run_id }}; do
          gh cache list --json key --jq '.[].key' | grep -qxF "$k" || { echo "::error::cache $k was not saved"; exit 1; }
        done
